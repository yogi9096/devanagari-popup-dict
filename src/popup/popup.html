<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
    <title>English to Hindi</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
  <header class="head">
    <div class="title">
      <span class="glyph" aria-hidden="true">अ</span>
      <span>
        <strong>English &rarr; Hindi</strong>
        <small id="status-line">loading&hellip;</small>
      </span>
    </div>

    <label class="switch" title="Turn the dictionary on or off everywhere">
      <input type="checkbox" id="enabled" aria-label="Enabled">
      <span class="slider"></span>
    </label>
  </header>

  <section class="section">
    <label class="row">
      <input type="checkbox" id="site-enabled">
      <span>Look up words on <b id="site-host">this site</b></span>
    </label>
  </section>

  <section class="section">
    <h2>Show the meaning when you</h2>
    <div class="segmented" role="group" aria-label="Trigger mode">
      <button type="button" data-trigger="selection">Select a word</button>
      <button type="button" data-trigger="hover">Hover a word</button>
      <button type="button" data-trigger="both">Either</button>
    </div>
    <p class="hint">Tip: select a word and release the mouse &mdash; that is the whole trick. Right-click or press <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd> also works. <kbd>Esc</kbd> closes a popup.</p>
  </section>

  <footer class="foot">
    <button type="button" class="link" id="open-options">All settings</button>
    <button type="button" class="link" id="open-catalog">Dictionary sources</button>
  </footer>

  <script src="../common/compat.js"></script>
  <script src="../common/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
